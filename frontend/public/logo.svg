<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22b072"/>
      <stop offset="100%" stop-color="#12724b"/>
    </linearGradient>
  </defs>
  <!-- Wallet body -->
  <rect x="6" y="16" width="52" height="36" rx="8" fill="url(#ec-grad)"/>
  <!-- Wallet fold / flap -->
  <path d="M6 24 Q6 16 14 16 H50 Q58 16 58 24 V28 H6 Z" fill="#104a34" opacity="0.35"/>
  <!-- E letterform cut from the wallet, formed by three horizontal bars -->
  <rect x="16" y="26" width="18" height="5" rx="2.5" fill="#f7f8fa"/>
  <rect x="16" y="34" width="14" height="5" rx="2.5" fill="#f7f8fa"/>
  <rect x="16" y="42" width="18" height="5" rx="2.5" fill="#f7f8fa"/>
  <rect x="16" y="26" width="5" height="21" rx="2.5" fill="#f7f8fa"/>
  <!-- Ascending trend line breaking out of the wallet -->
  <polyline points="34,40 42,32 47,36 56,20" fill="none" stroke="#f7f8fa" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="56,20 50,21 55,25" fill="#f7f8fa"/>
  <!-- Wallet clasp -->
  <circle cx="52" cy="34" r="3" fill="#f7f8fa"/>
</svg>
